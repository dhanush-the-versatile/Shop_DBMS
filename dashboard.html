<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dashboard | Jhansi Kirana & E-JUNCTION</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<header>
  <div class="logo-area">
    <h1>Jhansi Kirana & E-JUNCTION <span class="since">Since 2009</span></h1>
    <div class="address">
      plot no 2456, Ysr Nagar, Near Kondakarakam Road, Vizianagaram<br/>
      📞 9849377398, 9440163952
    </div>
  </div>
  <nav>
    <a href="inventory.html">Inventory</a>
    <a href="billing.html">Billing</a>
    <a href="returns.html">Returns</a>
    <a href="reports.html">Reports</a>
    <a href="#" onclick="logout()" style="float:right;">Logout</a>
  </nav>
  <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
</header>
<main>
  <p>Welcome to Jhansi Kirana & E-JUNCTION management system.</p>
</main>
<script>
if (!localStorage.getItem("isLogged")) {
  location.href = "index.html";
}
function logout() {
  localStorage.removeItem("isLogged");
  location.href = "index.html";
}
if(localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
}
function toggleTheme() {
  document.body.classList.toggle("dark");
  if(document.body.classList.contains("dark"))
    localStorage.setItem('theme', 'dark');
  else
    localStorage.setItem('theme', 'light');
}
</script>
</body>
</html>
